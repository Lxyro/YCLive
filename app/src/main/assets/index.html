<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YC Live - Pro Liquid Glass Studio Mirror</title>
  <script src="/jmuxer.min.js"></script>
  <style>
    :root {
      --bg-studio: #0B0B0E;
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-surface-hover: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-bright: rgba(255, 255, 255, 0.35);
      --text-pure: #FFFFFF;
      --text-muted: #D4D4D8;
      --text-dim: #71717A;
      --live-green: #10B981;
      --live-cyan: #38BDF8;
      --apple-blur: blur(32px) saturate(190%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-studio);
      color: var(--text-pure);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
      background: transparent;
      transition: object-fit 0.2s ease;
    }

    /* Minimalist Pro Studio Liquid Glass HUD */
    .hud-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .hud-bar.hidden {
      opacity: 0;
      transform: translateY(-12px);
    }

    .hud-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hud-pill {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      padding: 7px 15px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    /* Square Studio Logo Mark */
    .brand-mark {
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .square-logo-box {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: #141416;
      border: 1px solid #E4E4E7;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .square-logo-box svg {
      width: 12px;
      height: 12px;
      fill: #FFFFFF;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #EF4444;
      transition: all 0.3s ease;
    }

    .status-dot.live {
      background-color: var(--live-green);
      box-shadow: 0 0 12px var(--live-green);
      animation: pulseLive 1.6s infinite;
    }

    @keyframes pulseLive {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(1.2);
      }
    }

    .num-val {
      font-weight: 600;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }

    /* Minimalist Interactive Buttons */
    .controls-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .apple-btn {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: #FFFFFF;
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      cursor: pointer;
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-btn:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-bright);
      transform: translateY(-1px);
    }

    .apple-btn:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.22);
    }

    /* Center Status Overlay */
    #center-card {
      position: absolute;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      background: rgba(18, 18, 22, 0.82);
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      padding: 36px 48px;
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #center-card.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    #center-card h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #FFFFFF;
    }

    #center-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .ios-spinner {
      margin: 20px auto 0;
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="viewport">
    <!-- Apple Pro Studio Liquid Glass Top HUD -->
    <div class="hud-bar" id="hud">
      <div class="hud-group">
        <div class="hud-pill">
          <span class="brand-mark">
            <span class="square-logo-box">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            </span>
            YC LIVE
          </span>
        </div>
        <div class="hud-pill">
          <span class="status-dot" id="dot"></span>
          <span id="status-title">BAĞLANIYOR...</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">FPS:</span>
          <span class="num-val" id="fps-label">--</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">BİTRATE:</span>
          <span class="num-val" id="bitrate-label">-- Mbps</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">ÇÖZÜNÜRLÜK:</span>
          <span class="num-val" id="res-label">-- x --</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">GECİKME:</span>
          <span class="num-val" style="color:#10B981" id="lag-label">&lt;25ms (SIFIR)</span>
        </div>
      </div>

      <div class="controls-group">
        <button class="apple-btn" id="btn-scale">ÖLÇEK: SIĞDIR</button>
        <button class="apple-btn" id="btn-pip">PİP</button>
        <button class="apple-btn" id="btn-fullscreen">TAM EKRAN</button>
      </div>
    </div>

    <!-- Center Connecting Overlay -->
    <div id="center-card">
      <h2 id="card-title">YC LIVE PRO STUDIO</h2>
      <p id="card-sub">Android donanımsal H.264 60 FPS ultra düşük gecikmeli akış başlatılıyor...</p>
      <div class="ios-spinner" id="spinner"></div>
    </div>

    <!-- Hardware-Accelerated Video Player -->
    <video id="video-player" playsinline autoplay muted></video>
  </div>

  <script>
    (function () {
      'use strict';

      const video = document.getElementById('video-player');
      const dot = document.getElementById('dot');
      const statusTitle = document.getElementById('status-title');
      const fpsLabel = document.getElementById('fps-label');
      const bitrateLabel = document.getElementById('bitrate-label');
      const resLabel = document.getElementById('res-label');
      const lagLabel = document.getElementById('lag-label');
      const centerCard = document.getElementById('center-card');
      const hud = document.getElementById('hud');
      const btnScale = document.getElementById('btn-scale');
      const btnPip = document.getElementById('btn-pip');
      const btnFullscreen = document.getElementById('btn-fullscreen');

      let ws = null;
      let jmuxer = null;
      let frameCount = 0;
      let byteCount = 0;
      let lastMetricsTime = performance.now();
      let isLive = false;
      let scaleModeIndex = 0; // 0: contain, 1: cover, 2: fill
      const scaleModes = ['contain', 'cover', 'fill'];
      const scaleLabels = ['ÖLÇEK: SIĞDIR', 'ÖLÇEK: DOLDUR', 'ÖLÇEK: ESNET'];
      let isHudVisible = true;

      let smoothedDriftMs = 18;

      function initJMuxer() {
        if (jmuxer) return;
        try {
          if (typeof JMuxer === 'undefined') {
            console.warn('JMuxer bekleniyor...');
            setTimeout(initJMuxer, 80);
            return;
          }

          jmuxer = new JMuxer({
            node: 'video-player',
            mode: 'video',
            flushingTime: 0,
            fps: 120, // Support up to 120 FPS high-refresh rate competitive gaming
            clearBuffer: true,
            debug: false,
            onError: function (err) {
              console.warn('JMuxer log:', err);
            }
          });
          console.log('JMuxer Pro 120FPS sıfır gecikme motoru hazır.');
        } catch (e) {
          console.error('JMuxer hatası:', e);
        }
      }

      function onLiveStreamActive() {
        if (isLive) return;
        isLive = true;
        centerCard.classList.add('hidden');
        dot.className = 'status-dot live';
        statusTitle.innerText = 'CANLI (0ms)';
        video.play().catch(() => {});
        updateResolution();
      }

      function updateResolution() {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          const orientationTag = video.videoWidth >= video.videoHeight ? 'Yatay' : 'Dikey';
          resLabel.innerText = `${video.videoWidth}x${video.videoHeight} (${orientationTag})`;
        }
      }

      video.addEventListener('canplay', () => {
        video.play().catch(() => {});
      });

      video.addEventListener('playing', () => {
        onLiveStreamActive();
      });

      video.addEventListener('loadedmetadata', updateResolution);
      video.addEventListener('resize', updateResolution);

      // Heavy Latency Optimizer: Smooth Proportional Pacing (NO Micro-Seek Stutter)
      function optimizeLatency() {
        if (video.buffered.length > 0) {
          const end = video.buffered.end(video.buffered.length - 1);
          const drift = end - video.currentTime;

          // Only perform hard snap if real tab switch / lag spike (>300ms)
          if (drift > 0.35) {
            video.currentTime = end - 0.02;
          } else if (drift > 0.035) {
            // Proportional smooth catchup: gently drain buffer without micro-stutters
            video.playbackRate = 1.04;
          } else if (drift < 0.015) {
            video.playbackRate = 1.0;
          }

          // Exponential Moving Average filter: completely eliminates crazy 25-200ms flicker
          const instantMs = Math.max(5, Math.min(100, Math.round(drift * 1000)));
          smoothedDriftMs = Math.round(smoothedDriftMs * 0.88 + instantMs * 0.12);
        }
      }

      video.addEventListener('timeupdate', () => {
        onLiveStreamActive();
        optimizeLatency();
      });

      function connectWebSocket() {
        initJMuxer();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        dot.className = 'status-dot';
        statusTitle.innerText = 'BAĞLANILIYOR...';

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          console.log('YC Live Pro WebSocket bağlantısı kuruldu.');
          statusTitle.innerText = 'AKIS BEKLENİYOR...';
        };

        ws.onmessage = (e) => {
          if (e.data instanceof ArrayBuffer) {
            byteCount += e.data.byteLength;
            frameCount++;

            if (!jmuxer) initJMuxer();
            if (jmuxer) {
              jmuxer.feed({
                video: new Uint8Array(e.data)
              });
            }

            if (!isLive && frameCount > 2) {
              onLiveStreamActive();
            }
          }
        };

        ws.onerror = (err) => {
          console.warn('WebSocket hatası:', err);
        };

        ws.onclose = () => {
          isLive = false;
          dot.className = 'status-dot';
          statusTitle.innerText = 'BAĞLANTI KOPTU';
          centerCard.classList.remove('hidden');
          setTimeout(connectWebSocket, 1500);
        };
      }

      // Bitrate, FPS & Smooth Latency loop (Updates calm & stable once per second)
      setInterval(() => {
        const now = performance.now();
        const elapsed = (now - lastMetricsTime) / 1000;
        if (elapsed > 0) {
          const fps = Math.round(frameCount / elapsed);
          const mbps = ((byteCount * 8) / (elapsed * 1000000)).toFixed(1);

          fpsLabel.innerText = fps.toString();
          bitrateLabel.innerText = `${mbps} Mbps`;

          // Rock-solid smoothed latency readout
          if (smoothedDriftMs <= 35) {
            lagLabel.innerText = `<${smoothedDriftMs}ms (SIFIR)`;
            lagLabel.style.color = '#10B981';
          } else {
            lagLabel.innerText = `${smoothedDriftMs}ms`;
            lagLabel.style.color = '#F59E0B';
          }

          frameCount = 0;
          byteCount = 0;
          lastMetricsTime = now;
        }
        updateResolution();
        optimizeLatency();
      }, 1000);

      // Button Controls: Cycle 3 view modes
      btnScale.addEventListener('click', () => {
        scaleModeIndex = (scaleModeIndex + 1) % scaleModes.length;
        video.style.objectFit = scaleModes[scaleModeIndex];
        btnScale.innerText = scaleLabels[scaleModeIndex];
      });

      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.innerText = 'KÜÇÜLT';
        } else {
          document.exitFullscreen().catch(() => {});
          btnFullscreen.innerText = 'TAM EKRAN';
        }
      });

      btnPip.addEventListener('click', async () => {
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else if (document.pictureInPictureEnabled && video.readyState >= 2) {
            await video.requestPictureInPicture();
          }
        } catch (e) {
          console.warn('PiP hatası:', e);
        }
      });

      // Double Click to toggle HUD
      document.addEventListener('dblclick', () => {
        isHudVisible = !isHudVisible;
        hud.classList.toggle('hidden', !isHudVisible);
      });

      connectWebSocket();
    })();
  </script>
</body>

</html>
