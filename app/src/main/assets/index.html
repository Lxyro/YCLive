<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YC Live - Ultra Düşük Gecikmeli Ekran Yayını</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #08090C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: high-quality;
      display: block;
    }
    /* HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .hud-overlay.hidden {
      opacity: 0;
    }
    .badge-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #FF3D57;
      box-shadow: 0 0 10px #FF3D57;
      transition: background-color 0.3s ease;
    }
    .status-dot.live {
      background-color: #00E676;
      box-shadow: 0 0 12px #00E676;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    .accent-cyan { color: #00F0FF; }
    .accent-green { color: #00E676; }
    .accent-yellow { color: #FFD600; }

    /* Action Controls */
    .controls-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00F0FF;
      transform: translateY(-1px);
    }

    /* Center Toast / Message */
    #center-message {
      position: absolute;
      text-align: center;
      pointer-events: none;
      z-index: 5;
      background: rgba(13, 15, 20, 0.85);
      padding: 24px 36px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    #center-message h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #00F0FF;
    }
    #center-message p {
      font-size: 14px;
      color: #94A3B8;
    }
    .spinner {
      margin: 16px auto 0;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="viewport-container">
    <div class="hud-overlay" id="hud">
      <div class="badge-group">
        <div class="badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">BAĞLANILIYOR...</span>
        </div>
        <div class="badge">
          <span>FPS:</span>
          <span class="accent-cyan" id="fps-val">--</span>
        </div>
        <div class="badge">
          <span>BİTRATE:</span>
          <span class="accent-green" id="bitrate-val">-- Mbps</span>
        </div>
        <div class="badge">
          <span>ÇÖZÜNÜRLÜK:</span>
          <span id="res-val">-- x --</span>
        </div>
      </div>
      <div class="controls-group">
        <button class="btn" id="btn-fit">ÖLÇEK: SIĞDIR</button>
        <button class="btn" id="btn-fullscreen">TAM EKRAN</button>
      </div>
    </div>

    <div id="center-message">
      <h2 id="msg-title">YC LIVE BAĞLANTISI</h2>
      <p id="msg-subtitle">Android cihazından H.264 donanım akışı bekleniyor...</p>
      <div class="spinner" id="spinner"></div>
    </div>

    <canvas id="video-canvas"></canvas>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('video-canvas');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const fpsVal = document.getElementById('fps-val');
      const bitrateVal = document.getElementById('bitrate-val');
      const resVal = document.getElementById('res-val');
      const centerMsg = document.getElementById('center-message');
      const hud = document.getElementById('hud');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const btnFit = document.getElementById('btn-fit');

      let decoder = null;
      let ws = null;
      let sps = null;
      let pps = null;
      let decoderConfigured = false;
      let frameCount = 0;
      let byteCount = 0;
      let lastFpsTime = performance.now();
      let fitMode = 'contain'; // 'contain' or 'fill'
      let isHudVisible = true;

      // Check WebCodecs support
      if (!('VideoDecoder' in window)) {
        document.getElementById('msg-title').innerText = "Tarayıcı Desteği Yok";
        document.getElementById('msg-subtitle').innerText = "WebCodecs API bu tarayıcıda desteklenmiyor. Lütfen güncel Chrome, Edge veya Opera kullanın.";
        document.getElementById('spinner').style.display = 'none';
        return;
      }

      function initDecoder() {
        if (decoder && decoder.state !== 'closed') {
          try { decoder.close(); } catch (e) {}
        }

        decoder = new VideoDecoder({
          output: (videoFrame) => {
            // Buffer = 0 : Draw immediately and close frame instantly
            if (canvas.width !== videoFrame.displayWidth || canvas.height !== videoFrame.displayHeight) {
              canvas.width = videoFrame.displayWidth;
              canvas.height = videoFrame.displayHeight;
              resVal.innerText = `${videoFrame.displayWidth}x${videoFrame.displayHeight}`;
            }

            ctx.drawImage(videoFrame, 0, 0, canvas.width, canvas.height);
            videoFrame.close();

            frameCount++;
            if (centerMsg.style.display !== 'none') {
              centerMsg.style.display = 'none';
              statusDot.className = 'status-dot live';
              statusText.innerText = 'CANLI (0ms BUFFER)';
            }
          },
          error: (err) => {
            console.error('VideoDecoder Error:', err);
            decoderConfigured = false;
          }
        });
      }

      // Build AVCDecoderConfigurationRecord (avcC) extradata from SPS and PPS
      function buildAvcC(spsData, ppsData) {
        const totalLen = 7 + spsData.length + 1 + 2 + ppsData.length;
        const avcC = new Uint8Array(totalLen);
        let offset = 0;

        avcC[offset++] = 0x01; // configurationVersion
        avcC[offset++] = spsData[1]; // AVCProfileIndication
        avcC[offset++] = spsData[2]; // profile_compatibility
        avcC[offset++] = spsData[3]; // AVCLevelIndication
        avcC[offset++] = 0xFF; // lengthSizeMinusOneWithReserved (4-byte NAL lengths)
        avcC[offset++] = 0xE1; // numOfSequenceParameterSetsWithReserved (1 SPS)

        avcC[offset++] = (spsData.length >> 8) & 0xFF;
        avcC[offset++] = spsData.length & 0xFF;
        avcC.set(spsData, offset);
        offset += spsData.length;

        avcC[offset++] = 0x01; // numOfPictureParameterSets (1 PPS)
        avcC[offset++] = (ppsData.length >> 8) & 0xFF;
        avcC[offset++] = ppsData.length & 0xFF;
        avcC.set(ppsData, offset);

        return avcC;
      }

      function configureDecoderIfReady() {
        if (!sps || !pps || decoderConfigured) return;

        const profile = sps[1].toString(16).padStart(2, '0');
        const compat = sps[2].toString(16).padStart(2, '0');
        const level = sps[3].toString(16).padStart(2, '0');
        const codecString = `avc1.${profile}${compat}${level}`;

        const avcC = buildAvcC(sps, pps);

        try {
          decoder.configure({
            codec: codecString,
            description: avcC,
            optimizeForLatency: true
          });
          decoderConfigured = true;
          console.log(`WebCodecs VideoDecoder yapılandırıldı: ${codecString}`);
        } catch (e) {
          console.warn('avcC yapılandırma hatası, annexb doğrudan deneniyor:', e);
          try {
            decoder.configure({
              codec: codecString,
              optimizeForLatency: true
            });
            decoderConfigured = true;
          } catch (err2) {
            console.error('Decoder başlatılamadı:', err2);
          }
        }
      }

      // Split Annex-B stream into NAL Units and find start codes
      function parseAnnexB(buffer) {
        const bytes = new Uint8Array(buffer);
        const nalUnits = [];
        let len = bytes.length;
        let lastIndex = -1;

        for (let i = 0; i < len - 3; i++) {
          if (bytes[i] === 0 && bytes[i + 1] === 0 && (bytes[i + 2] === 1 || (bytes[i + 2] === 0 && bytes[i + 3] === 1))) {
            const startCodeLen = (bytes[i + 2] === 1) ? 3 : 4;
            if (lastIndex !== -1) {
              nalUnits.push(bytes.subarray(lastIndex, i));
            }
            lastIndex = i + startCodeLen;
            if (startCodeLen === 4) i++;
          }
        }
        if (lastIndex !== -1 && lastIndex < len) {
          nalUnits.push(bytes.subarray(lastIndex));
        }
        return nalUnits;
      }

      function handleNalPacket(packetBuffer) {
        const nalUnits = parseAnnexB(packetBuffer);
        if (nalUnits.length === 0) return;

        let hasKeyFrame = false;
        let isConfigPacket = false;
        const videoSlices = [];

        for (const nalu of nalUnits) {
          if (nalu.length === 0) continue;
          const nalType = nalu[0] & 0x1F;

          if (nalType === 7) { // SPS
            sps = nalu;
            isConfigPacket = true;
          } else if (nalType === 8) { // PPS
            pps = nalu;
            isConfigPacket = true;
          } else if (nalType === 5) { // IDR Slice
            hasKeyFrame = true;
            videoSlices.push(nalu);
          } else if (nalType === 1) { // Non-IDR Slice
            videoSlices.push(nalu);
          }
        }

        if (isConfigPacket && (!decoderConfigured || decoder.state !== 'configured')) {
          configureDecoderIfReady();
        }

        if (videoSlices.length > 0 && decoderConfigured && decoder.state === 'configured') {
          // Calculate length-prefixed packet for WebCodecs chunk
          let totalBytes = 0;
          for (const slice of videoSlices) {
            totalBytes += 4 + slice.length;
          }
          const chunkData = new Uint8Array(totalBytes);
          let offset = 0;
          const dv = new DataView(chunkData.buffer);

          for (const slice of videoSlices) {
            dv.setUint32(offset, slice.length, false); // Big endian 4-byte length
            offset += 4;
            chunkData.set(slice, offset);
            offset += slice.length;
          }

          const chunk = new EncodedVideoChunk({
            type: hasKeyFrame ? 'key' : 'delta',
            timestamp: performance.now() * 1000, // microseconds
            data: chunkData
          });

          try {
            decoder.decode(chunk);
          } catch (e) {
            console.error('Kare decode hatası:', e);
          }
        }
      }

      function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        statusDot.className = 'status-dot';
        statusText.innerText = 'BAĞLANILIYOR...';

        initDecoder();
        decoderConfigured = false;

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          console.log('YC Live WebSocket bağlantısı kuruldu.');
          statusText.innerText = 'AKIS BEKLENİYOR...';
        };

        ws.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            byteCount += event.data.byteLength;
            handleNalPacket(event.data);
          }
        };

        ws.onerror = (err) => {
          console.warn('WebSocket hatası:', err);
        };

        ws.onclose = () => {
          console.log('WebSocket bağlantısı koptu, 1.5 sn sonra yeniden bağlanılıyor...');
          statusDot.className = 'status-dot';
          statusText.innerText = 'KOPUK - TEKRAR DENENİYOR';
          centerMsg.style.display = 'block';
          setTimeout(connectWebSocket, 1500);
        };
      }

      // FPS and Bitrate Tracker (Runs every second)
      setInterval(() => {
        const now = performance.now();
        const elapsed = (now - lastFpsTime) / 1000;
        if (elapsed > 0) {
          const fps = Math.round(frameCount / elapsed);
          const mbps = ((byteCount * 8) / (elapsed * 1000000)).toFixed(1);

          fpsVal.innerText = fps.toString();
          bitrateVal.innerText = `${mbps} Mbps`;

          frameCount = 0;
          byteCount = 0;
          lastFpsTime = now;
        }
      }, 1000);

      // Fit mode toggle
      btnFit.addEventListener('click', () => {
        if (fitMode === 'contain') {
          fitMode = 'cover';
          canvas.style.objectFit = 'cover';
          btnFit.innerText = 'ÖLÇEK: DOLDUR';
        } else {
          fitMode = 'contain';
          canvas.style.objectFit = 'contain';
          btnFit.innerText = 'ÖLÇEK: SIĞDIR';
        }
      });

      // Fullscreen toggle
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.innerText = 'KÜÇÜLT';
        } else {
          document.exitFullscreen().catch(() => {});
          btnFullscreen.innerText = 'TAM EKRAN';
        }
      });

      // Double-click to toggle HUD
      document.addEventListener('dblclick', () => {
        isHudVisible = !isHudVisible;
        hud.classList.toggle('hidden', !isHudVisible);
      });

      // Start connection
      connectWebSocket();
    })();
  </script>
</body>
</html>
