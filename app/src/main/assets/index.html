<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YC Live - Apple Liquid Glass Mirror</title>
  <script src="/jmuxer.min.js"></script>
  <style>
    :root {
      --bg-canvas: #09090B;
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-surface-hover: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-bright: rgba(255, 255, 255, 0.28);
      --text-pure: #FFFFFF;
      --text-muted: #A1A1AA;
      --text-dim: #71717A;
      --live-green: #10B981;
      --apple-blur: blur(28px) saturate(180%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-pure);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
      background: transparent;
    }

    /* Minimalist Apple Frosted Glass Top HUD */
    .hud-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }

    .hud-bar.hidden {
      opacity: 0;
      transform: translateY(-10px);
    }

    .hud-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hud-pill {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .brand-mark {
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-mark svg {
      width: 16px;
      height: 16px;
      fill: #FFFFFF;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #EF4444;
      transition: all 0.3s ease;
    }

    .status-dot.live {
      background-color: var(--live-green);
      box-shadow: 0 0 10px var(--live-green);
      animation: pulseLive 1.8s infinite;
    }

    @keyframes pulseLive {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(1.18);
      }
    }

    .num-val {
      font-weight: 600;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }

    /* Minimalist Interactive Buttons */
    .controls-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .apple-btn {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: #FFFFFF;
      padding: 7px 15px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      cursor: pointer;
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-btn:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-bright);
      transform: translateY(-1px);
    }

    .apple-btn:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Center Status Overlay */
    #center-card {
      position: absolute;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      background: rgba(22, 22, 25, 0.78);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      padding: 34px 44px;
      border-radius: 26px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #center-card.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    #center-card h2 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #FFFFFF;
    }

    #center-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .ios-spinner {
      margin: 18px auto 0;
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="viewport">
    <!-- Apple Liquid Glass Top HUD -->
    <div class="hud-bar" id="hud">
      <div class="hud-group">
        <div class="hud-pill">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            YC LIVE
          </span>
        </div>
        <div class="hud-pill">
          <span class="status-dot" id="dot"></span>
          <span id="status-title">BAĞLANIYOR...</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">FPS:</span>
          <span class="num-val" id="fps-label">--</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">BİTRATE:</span>
          <span class="num-val" id="bitrate-label">-- Mbps</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">ÇÖZÜNÜRLÜK:</span>
          <span class="num-val" id="res-label">-- x --</span>
        </div>
        <div class="hud-pill">
          <span style="color:var(--text-dim)">GECİKME:</span>
          <span class="num-val" style="color:#10B981">&lt;40ms</span>
        </div>
      </div>

      <div class="controls-group">
        <button class="apple-btn" id="btn-scale">ÖLÇEK: SIĞDIR</button>
        <button class="apple-btn" id="btn-pip">PİP</button>
        <button class="apple-btn" id="btn-fullscreen">TAM EKRAN</button>
      </div>
    </div>

    <!-- Center Connecting Overlay -->
    <div id="center-card">
      <h2 id="card-title">YC LIVE BAĞLANTISI</h2>
      <p id="card-sub">Android cihazından H.264 ultra düşük gecikmeli akış bekleniyor...</p>
      <div class="ios-spinner" id="spinner"></div>
    </div>

    <!-- Hardware-Accelerated Video Player -->
    <video id="video-player" playsinline autoplay muted></video>
  </div>

  <script>
    (function () {
      'use strict';

      const video = document.getElementById('video-player');
      const dot = document.getElementById('dot');
      const statusTitle = document.getElementById('status-title');
      const fpsLabel = document.getElementById('fps-label');
      const bitrateLabel = document.getElementById('bitrate-label');
      const resLabel = document.getElementById('res-label');
      const centerCard = document.getElementById('center-card');
      const hud = document.getElementById('hud');
      const btnScale = document.getElementById('btn-scale');
      const btnPip = document.getElementById('btn-pip');
      const btnFullscreen = document.getElementById('btn-fullscreen');

      let ws = null;
      let jmuxer = null;
      let frameCount = 0;
      let byteCount = 0;
      let lastMetricsTime = performance.now();
      let isLive = false;
      let fitMode = 'contain';
      let isHudVisible = true;

      function initJMuxer() {
        if (jmuxer) return;
        try {
          if (typeof JMuxer === 'undefined') {
            console.warn('JMuxer henüz yüklenmedi, 100ms sonra tekrar denenecek...');
            setTimeout(initJMuxer, 100);
            return;
          }

          jmuxer = new JMuxer({
            node: 'video-player',
            mode: 'video',
            flushingTime: 0,
            fps: 60,
            clearBuffer: true,
            debug: false,
            onError: function (err) {
              console.warn('JMuxer event:', err);
            }
          });
          console.log('JMuxer sıfır gecikme motoru başarıyla başlatıldı.');
        } catch (e) {
          console.error('JMuxer ilklendirme hatası:', e);
        }
      }

      function onLiveStreamActive() {
        if (isLive) return;
        isLive = true;
        centerCard.classList.add('hidden');
        dot.className = 'status-dot live';
        statusTitle.innerText = 'CANLI (0ms)';
        video.play().catch(() => {});
        updateResolution();
      }

      function updateResolution() {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          resLabel.innerText = `${video.videoWidth}x${video.videoHeight}`;
        }
      }

      video.addEventListener('canplay', () => {
        video.play().catch(() => {});
      });

      video.addEventListener('playing', () => {
        onLiveStreamActive();
      });

      video.addEventListener('loadedmetadata', updateResolution);
      video.addEventListener('resize', updateResolution);

      video.addEventListener('timeupdate', () => {
        onLiveStreamActive();
        // Aggressive Live Edge Chase for 0-40ms latency
        if (video.buffered.length > 0) {
          const end = video.buffered.end(video.buffered.length - 1);
          const drift = end - video.currentTime;
          if (drift > 0.08) {
            video.currentTime = end - 0.01;
          }
        }
      });

      function connectWebSocket() {
        initJMuxer();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        dot.className = 'status-dot';
        statusTitle.innerText = 'BAĞLANILIYOR...';

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          console.log('YC Live WebSocket bağlantısı kuruldu.');
          statusTitle.innerText = 'AKIS BEKLENİYOR...';
        };

        ws.onmessage = (e) => {
          if (e.data instanceof ArrayBuffer) {
            byteCount += e.data.byteLength;
            frameCount++;

            if (!jmuxer) initJMuxer();
            if (jmuxer) {
              jmuxer.feed({
                video: new Uint8Array(e.data)
              });
            }

            if (!isLive && frameCount > 2) {
              onLiveStreamActive();
            }
          }
        };

        ws.onerror = (err) => {
          console.warn('WebSocket hatası:', err);
        };

        ws.onclose = () => {
          isLive = false;
          dot.className = 'status-dot';
          statusTitle.innerText = 'BAĞLANTI KOPTU';
          centerCard.classList.remove('hidden');
          setTimeout(connectWebSocket, 1500);
        };
      }

      // Bitrate & FPS loop
      setInterval(() => {
        const now = performance.now();
        const elapsed = (now - lastMetricsTime) / 1000;
        if (elapsed > 0) {
          const fps = Math.round(frameCount / elapsed);
          const mbps = ((byteCount * 8) / (elapsed * 1000000)).toFixed(1);

          fpsLabel.innerText = fps.toString();
          bitrateLabel.innerText = `${mbps} Mbps`;

          frameCount = 0;
          byteCount = 0;
          lastMetricsTime = now;
        }
        updateResolution();
      }, 1000);

      // Button Controls
      btnScale.addEventListener('click', () => {
        if (fitMode === 'contain') {
          fitMode = 'cover';
          video.style.objectFit = 'cover';
          btnScale.innerText = 'ÖLÇEK: DOLDUR';
        } else {
          fitMode = 'contain';
          video.style.objectFit = 'contain';
          btnScale.innerText = 'ÖLÇEK: SIĞDIR';
        }
      });

      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.innerText = 'KÜÇÜLT';
        } else {
          document.exitFullscreen().catch(() => {});
          btnFullscreen.innerText = 'TAM EKRAN';
        }
      });

      btnPip.addEventListener('click', async () => {
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else if (document.pictureInPictureEnabled && video.readyState >= 2) {
            await video.requestPictureInPicture();
          }
        } catch (e) {
          console.warn('PiP hatası:', e);
        }
      });

      // Double Click to toggle HUD
      document.addEventListener('dblclick', () => {
        isHudVisible = !isHudVisible;
        hud.classList.toggle('hidden', !isHudVisible);
      });

      connectWebSocket();
    })();
  </script>
</body>

</html>
